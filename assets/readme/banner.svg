<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="t d">
  <title id="t">Strata</title>
  <desc id="d">No-API Vulkan 1.3+ and Slang console compatibility layer written in Rust: native x86-64 execution, direct RDNA2 to SPIR-V 1.6, 64-bit BDA, and 3-tier hybrid UMA</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d18"/>
      <stop offset=".52" stop-color="#241129"/>
      <stop offset="1" stop-color="#072434"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f76b45"/>
      <stop offset=".38" stop-color="#e04068"/>
      <stop offset=".72" stop-color="#8f78ff"/>
      <stop offset="1" stop-color="#35d6ea"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="620" y2="0">
      <stop offset="0" stop-color="#ff7a52"/>
      <stop offset=".38" stop-color="#f0557d"/>
      <stop offset=".72" stop-color="#a88cff"/>
      <stop offset="1" stop-color="#4fe3f2"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e04068" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#8f78ff" stop-opacity=".46"/>
      <stop offset="1" stop-color="#35d6ea" stop-opacity=".4"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e0405a" stop-opacity=".46"/>
      <stop offset="1" stop-color="#e0405a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1fb9d8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#1fb9d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="card"><rect width="1280" height="380" rx="28"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif }
    .flow { fill: none; stroke: url(#ink); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 22; opacity: .5; animation: run 9s linear infinite }
    .b { animation-duration: 13s; opacity: .34 }
    .c { animation-duration: 17s; opacity: .24 }
    .slab { animation: lift 6s ease-in-out infinite }
    .s2 { animation-delay: -2s }
    .s3 { animation-delay: -4s }
    @keyframes run { to { stroke-dashoffset: -560 } }
    @keyframes lift { 50% { transform: translateY(-7px) } }
    @media (prefers-reduced-motion: reduce) { .flow, .slab { animation: none } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <circle cx="180" cy="360" r="340" fill="url(#glow1)"/>
    <circle cx="1130" cy="40" r="330" fill="url(#glow2)"/>
    <rect width="1280" height="380" fill="url(#grid)"/>
    <path class="flow" d="M-20 70C260 10 420 150 700 90S1120 20 1300 96"/>
    <path class="flow b" d="M-20 330C240 380 470 250 720 300S1090 380 1300 300"/>
    <path class="flow c" d="M-20 190C300 120 520 260 760 190S1110 130 1300 200"/>
    <path class="flow b" d="M-20 250C220 300 520 180 800 250S1130 260 1300 240"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
      <g stroke="#e05882" opacity=".52" filter="url(#soft)">
        <path d="M162 114C155 104 114 102 110 123C107 141 132 145 144 148C162 153 168 164 164 176C159 191 120 193 108 180"/>
        <path d="M196 104H256M226 104V190"/>
        <path d="M286 190V104H322A22 22 0 0 1 322 148H286M320 148 344 190"/>
        <path d="M374 190 406 104 438 190M386 164H426"/>
        <path d="M462 104H522M492 104V190"/>
        <path d="M546 190 578 104 610 190M558 164H598"/>
      </g>
      <g stroke="url(#mark)">
        <path d="M162 114C155 104 114 102 110 123C107 141 132 145 144 148C162 153 168 164 164 176C159 191 120 193 108 180"/>
        <path d="M196 104H256M226 104V190"/>
        <path d="M286 190V104H322A22 22 0 0 1 322 148H286M320 148 344 190"/>
        <path d="M374 190 406 104 438 190M386 164H426"/>
        <path d="M462 104H522M492 104V190"/>
        <path d="M546 190 578 104 610 190M558 164H598"/>
      </g>
    </g>
    <text x="98" y="264" font-size="28" font-weight="700" fill="#f7f5ff">No-API Vulkan 1.3+ &amp; Slang console compatibility layer</text>
    <text x="98" y="302" font-size="18.5" fill="#c9c2e0">Native x86-64&#160;&#160;·&#160;&#160;Direct RDNA2 → SPIR-V 1.6&#160;&#160;·&#160;&#160;64-bit BDA&#160;&#160;·&#160;&#160;3-Tier Hybrid UMA</text>

    <g transform="translate(1062 0)" stroke-linejoin="round">
      <g stroke="#c69cff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 7">
        <path d="M0 152V196M-130 108V276M130 108V276"/>
      </g>
      <g class="slab s3">
        <path d="M-130 276 0 314V332L-130 294Z" fill="#321430"/>
        <path d="M130 276 0 314V332L130 294Z" fill="#0d3a52"/>
        <path d="M0 238 130 276 0 314-130 276Z" fill="url(#face)" stroke="url(#ink)" stroke-width="2"/>
        <text x="0" y="283" font-size="20" font-weight="700" fill="#f7f5ff" text-anchor="middle">Vulkan 1.3+</text>
      </g>
      <g class="slab s2">
        <path d="M-130 190 0 228V246L-130 208Z" fill="#42183a"/>
        <path d="M130 190 0 228V246L130 208Z" fill="#12415c"/>
        <path d="M0 152 130 190 0 228-130 190Z" fill="url(#face)" stroke="url(#ink)" stroke-width="2"/>
        <text x="0" y="197" font-size="18" font-weight="700" fill="#f7f5ff" text-anchor="middle">RDNA2 → SPIR-V</text>
      </g>
      <g class="slab">
        <path d="M-130 104 0 142V160L-130 122Z" fill="#521d42"/>
        <path d="M130 104 0 142V160L130 122Z" fill="#174a68"/>
        <path d="M0 66 130 104 0 142-130 104Z" fill="url(#face)" stroke="url(#ink)" stroke-width="2"/>
        <text x="0" y="111" font-size="20" font-weight="700" fill="#f7f5ff" text-anchor="middle">Native x64</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="378" rx="27" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
</svg>
