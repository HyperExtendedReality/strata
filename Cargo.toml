[workspace]
resolver = "2"
members = [
    "crates/strata-shader",
    "crates/strata-runtime-shaders",
    "crates/strata-gpu",
    "crates/strata-hle",
    "crates/strata-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ash = "0.38"
thiserror = "2"
