[workspace]
resolver = "2"
members = [
    "crates/strata-formats",
    "crates/strata-shader",
    "crates/strata-runtime-shaders",
    "crates/strata-gpu",
    "crates/strata-hle",
    "crates/strata-cli",
    "xtask",
]
# Vendored third-party code keeps its own license and lints.
exclude = ["third_party/bcpack-rs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ash = "0.38"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
manual_is_multiple_of = "allow"
missing_safety_doc = "allow"
too_many_arguments = "allow"
vec_init_then_push = "allow"
identity_op = "allow"
not_unsafe_ptr_arg_deref = "allow"
manual_clamp = "allow"
implicit_saturating_sub = "allow"
min_max = "allow"
unusual_byte_groupings = "allow"
manual_memcpy = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.diag]
inherits = "release"
lto = false
codegen-units = 16
